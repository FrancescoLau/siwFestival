<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${regista.nome + ' ' + regista.cognome + ' - CineFest'}">Dettagli Regista - CineFest</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="body-autenticazione">

    <div class="contenitore-auth" style="max-width: 700px;">
        <div class="auth-header">
            <span class="auth-logo">🎬 CINEFEST</span>
            <h2 th:text="${regista.nome + ' ' + regista.cognome}">Nome Cognome</h2>
        </div>

        <div style="background-color: #f9f9f9; padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid #e0e0e0;">
            <p><strong>Nome:</strong> <span th:text="${regista.nome}">Nome</span></p>
            <p><strong>Cognome:</strong> <span th:text="${regista.cognome}">Cognome</span></p>
            <p><strong>Data di Nascita:</strong> <span th:text="${#temporals.format(regista.dataNascita, 'dd/MM/yyyy')}">01/01/1970</span></p>
            <!-- Data di Morte visualizzata solo se presente -->
            <p th:if="${regista.dataMorte != null}">
                <strong>Data di Morte:</strong> 
                <span th:text="${#temporals.format(regista.dataMorte, 'dd/MM/yyyy')}">01/01/2020</span>
            </p>
            <p><strong>Nazionalità:</strong> <span th:text="${regista.nazionalita != null and !regista.nazionalita.isBlank()} ? ${regista.nazionalita} : 'Non specificata'">Italia</span></p>
        </div>

        <div class="sezione-form-titolo" style="margin-top: 1rem; font-weight: bold; font-size: 1.2rem;">
            <span>📽️ Film Diretti:</span>
        </div>

        <div style="margin-top: 0.8rem;">
            <div th:if="${regista.filmDiretti == null or #lists.isEmpty(regista.filmDiretti)}">
                <p style="font-size: 0.95rem; color: #777; font-style: italic;">Nessun film associato a questo regista.</p>
            </div>

            <ul th:unless="${regista.filmDiretti == null or #lists.isEmpty(regista.filmDiretti)}" style="list-style-type: none; padding-left: 0;">
                <li th:each="film : ${regista.filmDiretti}" style="padding: 0.8rem; margin-bottom: 0.5rem; background-color: #ffffff; border: 1px solid #ddd; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong th:text="${film.titolo}">Titolo Film</strong> 
                        <span th:text="'(' + ${film.anno} + ')'" style="color: #666; font-size: 0.9rem;">(2020)</span>
                        <div style="font-size: 0.85rem; color: #888;" th:text="${film.genere + ' • ' + film.durata + ' min • ' + film.paeseProduzione}">Genere • Durata • Paese</div>
                    </div>
                    <a th:href="@{'/film/' + ${film.id}}" class="link-ritorno-soft" style="font-weight: bold; text-decoration: none;">Dettagli ➔</a>
                </li>
            </ul>
        </div>

        <div class="auth-footer-links" style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem;">
            <a th:href="@{/registi}" class="link-ritorno-soft">Torna ai registi</a>
            <a th:href="@{/film}" class="link-ritorno-soft">Torna ai film</a>
        </div>
    </div>

</body>
</html>
