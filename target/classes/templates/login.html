<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CineFest</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

    <header class="navbar">
        <a th:href="@{/}" class="logo">🎬 CineFest</a>
        <nav class="nav-links">
            <a th:href="@{/register}" class="btn btn-primary">Registrati</a>
        </nav>
    </header>

    <main class="main-content">
        <div style="max-width: 420px; margin: 3rem auto; padding: 2rem; border: 1px solid #e2e8f0; border-radius: 8px; background-color: #ffffff; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
            <h2 style="margin-top: 0; text-align: center;">Accedi a CineFest</h2>

            <!-- Messaggio di errore letto da messages.properties se param.error è presente -->
            <div th:if="${param.error}" style="color: #ef4444; background-color: #fee2e2; border: 1px solid #fca5a5; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1.25rem;">
                <p style="margin: 0; font-size: 0.9rem;" th:text="#{login.error}">Username o password non validi.</p>
            </div>

            <!-- Messaggio di logout letto da messages.properties se param.logout è presente -->
            <div th:if="${param.logout}" style="color: #15803d; background-color: #dcfce7; border: 1px solid #86efac; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1.25rem;">
                <p style="margin: 0; font-size: 0.9rem;" th:text="#{login.logout}">Logout effettuato con successo.</p>
            </div>

            <!-- Form di login: th:action inserisce in automatico il token CSRF -->
            <form th:action="@{/login}" method="post">
                <div style="margin-bottom: 1rem;">
                    <label for="username" style="display: block; font-weight: 600; margin-bottom: 0.25rem;">Username:</label>
                    <input type="text" id="username" name="username" style="width: 100%; box-sizing: border-box; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 4px;" >
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label for="password" style="display: block; font-weight: 600; margin-bottom: 0.25rem;">Password:</label>
                    <input type="password" id="password" name="password" style="width: 100%; box-sizing: border-box; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 4px;" >
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Accedi</button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: #64748b;">
                Non hai ancora un account? <a th:href="@{/register}" style="color: #2563eb; text-decoration: none; font-weight: 600;">Registrati qui</a>
            </div>

            <div style="margin-top: 1rem; text-align: center;">
                <a th:href="@{/}" class="link-ritorno-soft" style="font-size: 0.85rem;">🏠 Torna alla Home</a>
            </div>
        </div>
    </main>

</body>
</html>
