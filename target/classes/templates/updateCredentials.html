<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifica Credenziali - CineFest</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div style="max-width: 500px; margin: 3rem auto; padding: 2rem; border: 1px solid #ccc; border-radius: 8px;">
        <h2 style="margin-top: 0;">Modifica Credenziali</h2>
		
        <form th:action="@{/updateCredentials}" method="post" th:object="${credentials}">

            <!-- Username -->
            <div style="margin-bottom: 1rem;">
                <label for="username"><strong>Username:</strong></label><br>
                <input type="text" id="username" th:field="*{username}" style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;" required>
                <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color: red; font-size: 0.85rem;"></span>
            </div>

            <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid #ddd;">
            <p style="font-size: 0.9rem; color: #666;">Lascia vuoti i campi password se non desideri cambiarla.</p>

            <!-- Password Attuale -->
            <div style="margin-bottom: 1rem;">
                <label for="oldPassword">Password attuale:</label><br>
                <input type="password" id="oldPassword" name="oldPassword" style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
            </div>

            <!-- Nuova Password -->
            <div style="margin-bottom: 1rem;">
                <label for="password">Nuova password:</label><br>
                <input type="password" id="password" th:field="*{password}" style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
                
            </div>

            <!-- Conferma Nuova Password -->
            <div style="margin-bottom: 1.5rem;">
                <label for="confirmNewPassword">Conferma nuova password:</label><br>
                <input type="password" id="confirmNewPassword" name="confirmNewPassword" style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
            </div>

            <!-- Pulsanti -->
            <div style="display: flex; gap: 1rem; align-items: center;">
                <button type="submit" class="btn btn-primary">Salva Modifiche</button>
                <a th:href="@{/}" class="btn btn-outline">Annulla</a>
            </div>
			<span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red; font-size: 0.85rem;"></span>
        </form>
    </div>

</body>
</html>
